# source = /home/justin/.cache/wal/colors-hyprland.conf
$foreground = rgba(35, 203, 30, 1.0)

# BACKGROUND
background {
    monitor =
    #path = screenshot
    path = /home/kenramiscal/Wallpaper/1.png
    #color = $background
    blur_passes = 3
    blur_size = 2
    contrast = 1
    brightness = 1
    vibrancy = 0.1696
}

# GENERAL
general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 48
    outline_thickness = 3
    dots_size = 0.3 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = false
    dots_rounding = 0
    outer_color = $foreground
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = $foreground
    font_family = DM Mono Medium
    fade_on_empty = false
    rounding = 0
    check_color = #ff000000
    placeholder_text = <span>Input Password...</span>
    placeholder_center = false
    hide_input = false
    halign = center
    valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = $foreground
  font_size = 22
  font_weight = 600
  font_family = Cascadia Code Bold
  position = 0, 300
  halign = center
  valign = center
}

# TIME
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%-I:%M")"
  color = $foreground
  font_size = 95
  font_family = DM Mono SemiBold
  position = 0, 200
  halign = center
  valign = center
}



